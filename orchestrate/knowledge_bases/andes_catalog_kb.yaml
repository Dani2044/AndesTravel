spec_version: v1
kind: knowledge_base
name: andes_catalog_kb
description: |-
  Catálogo de paquetes turísticos nacionales de Andes Travel por Colombia (destino,
  duración, qué incluye, para quién es ideal y tarifa base por persona en COP) y las
  políticas de la agencia: cancelación, seguro de viaje opcional, productos que no vende,
  vencimiento de cotizaciones, pagos y horario de asesores.
vector_index:
  embeddings_model_name: ibm/granite-embedding-278m-multilingual
  chunk_size: 400
  chunk_overlap: 50
  extraction_strategy: standard
conversational_search_tool:
  language: en
  index_config: []
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find anything related to
      your query
    display_text_connectivity_issue: I might have information related to your query to share, but am unable
      to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
    enabled: false
  query_rewrite:
    enabled: true
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  query_source: Agent
  agent_query_description: The query to search for in the knowledge base
  supports_full_document: false
prioritize_built_in_index: true
representation: tool
documents:
- docs/catalogo.md
- docs/politicas_faq.md
