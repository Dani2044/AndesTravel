display_name: quotation_agent
description: 'Checks availability for a travel package and issues an itemized quote
  with an expiry. Use when the traveler asks for a price, availability, or a quote.

  '
context_access_enabled: true
context_variables: []
voice_configuration: Redeban-anomalias
