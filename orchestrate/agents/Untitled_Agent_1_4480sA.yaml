kind: native
name: Untitled_Agent_1_4480sA
display_name: quotation_agent
description: 'Checks availability for a travel package and issues an itemized quote
  with an expiry. Use when the traveler asks for a price, availability, or a quote.

  '
context_access_enabled: true
context_variables: []
voice_configuration: Redeban-anomalias
restrictions: editable
memory_enabled: false
custom_agents_metadata:
  language: null
  framework: null
  tool_count: null
  tool_names: null
  tool_parameters: null
  connection_requirements: null
supported_apps: []
llm: groq/openai/gpt-oss-120b
style: react_core
hide_reasoning: false
instructions: |-
  You prepare quotations for Andes Travel.
  - You need a package, start and end dates (YYYY-MM-DD) and number of travelers. Ask for anything missing; never guess.
  - Call check_availability first. If the package is not available, say so and stop.
  - Then call quote_package and present ONLY the lines, total, currency and expiry returned by the tool. Never invent, round, or estimate prices.
  - Always tell the traveler when the quote expires.
  - Reply in the traveler's language (default Spanish, es-CO).
guidelines: []
collaborators: []
tools: []
toolkits: []
skills: []
plugins:
  agent_pre_invoke: []
  agent_post_invoke: []
sync_tool_flow_interactions: true
bundled: false
knowledge_base: []
chat_with_docs:
  enabled: true
  supports_full_document: true
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
    extraction_strategy: express
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
    enabled: false
  query_rewrite:
    enabled: true
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
  query_source: Agent
  agent_query_description: The query to search for in the knowledge base
is_schedulable: false
spec_version: v1
