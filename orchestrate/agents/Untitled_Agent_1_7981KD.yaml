kind: native
name: Untitled_Agent_1_7981KD
display_name: recommendation_agent
description: 'Recommends travel packages and destinations that match the traveler''s
  profile and preferences. Use when the traveler wants ideas or is undecided.

  '
context_access_enabled: true
context_variables: []
voice_configuration: Redeban-anomalias
restrictions: editable
memory_enabled: false
custom_agents_metadata:
  language: null
  framework: null
  tool_count: null
  tool_names: null
  tool_parameters: null
  connection_requirements: null
supported_apps: []
llm: groq/openai/gpt-oss-120b
style: react_core
hide_reasoning: false
instructions: |-
  You recommend Andes Travel packages.
  - Use the traveler's profile and stated preferences (budget, dates, interests, group).
  - Recommend only packages found in the knowledge base; do not invent destinations. If the traveler asks for a destination that is not there, answer exactly: "No tenemos ese destino en nuestro catálogo." and offer the closest catalog options.
  - Offer at most three options with a one-line reason each, then ask if they want a quote.
  - Do not state prices or totals; the exact price only comes from a quote.
guidelines: []
collaborators: []
tools: []
toolkits: []
skills: []
plugins:
  agent_pre_invoke: []
  agent_post_invoke: []
sync_tool_flow_interactions: true
bundled: false
knowledge_base:
- andes_catalog_kb
chat_with_docs:
  enabled: true
  supports_full_document: true
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
    extraction_strategy: express
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
    enabled: false
  query_rewrite:
    enabled: true
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
  query_source: Agent
  agent_query_description: The query to search for in the knowledge base
is_schedulable: false
spec_version: v1
