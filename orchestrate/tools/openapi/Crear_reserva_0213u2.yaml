openapi: 3.0.3
info:
  title: Crear reserva
  version: 1.0.0
servers:
- url: https://andes-tools-api.onrender.com
paths:
  /reservations:
    post:
      operationId: Crear_reserva_0213u2
      summary: Crear reserva
      description: 'Book a quote the traveler explicitly accepted. Fails with quote_expired when the quote
        is past its expiry and with quote_not_found when the quote does not exist for this traveler. A
        quote is booked at most once: a retry returns the same booking (deduplicated=true).'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                traveler_id:
                  type: string
                  title: Traveler Id
                  description: Traveler e-mail or mobile number.
                quote_id:
                  type: string
                  title: Quote Id
                  description: The quote the traveler explicitly accepted.
              type: object
              required:
              - traveler_id
              - quote_id
              title: ReservationIn
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                properties:
                  ok:
                    type: boolean
                    title: Ok
                    description: False when the request could not be fulfilled; see error.
                  error:
                    properties:
                      code:
                        type: string
                        title: Code
                        description: Stable error code, e.g. unknown_package, invalid_dates.
                      message:
                        type: string
                        title: Message
                        description: Short explanation in Spanish, safe to tell the traveler.
                    type: object
                    required:
                    - code
                    - message
                    title: ErrorInfo
                  reservation_id:
                    type: string
                    title: Reservation Id
                  status:
                    type: string
                    title: Status
                  quote_id:
                    type: string
                    title: Quote Id
                  package:
                    properties:
                      package_id:
                        type: string
                        title: Package Id
                      destination:
                        type: string
                        title: Destination
                      name:
                        type: string
                        title: Name
                      duration_days:
                        type: integer
                        title: Duration Days
                    type: object
                    required:
                    - package_id
                    - destination
                    - name
                    - duration_days
                    title: PackageInfo
                  start_date:
                    type: string
                    title: Start Date
                  end_date:
                    type: string
                    title: End Date
                  travelers:
                    type: integer
                    title: Travelers
                  total:
                    properties:
                      amount:
                        type: integer
                        title: Amount
                        description: Integer amount in the currency's units (COP has no cents).
                      currency:
                        type: string
                        title: Currency
                    type: object
                    required:
                    - amount
                    - currency
                    title: Money
                  deduplicated:
                    type: boolean
                    title: Deduplicated
                    description: True when this key was already used; nothing new was booked.
                    default: false
                type: object
                required:
                - ok
                title: ReservationOut
      security:
      - scheme0: []
      x-ibm-orchestrate-app-id: andes_tools_api
components:
  securitySchemes:
    scheme0:
      type: apiKey
      in: header
      name: X-API-Key
