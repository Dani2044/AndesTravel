openapi: 3.0.3
info:
  title: Cotizar paquete
  version: 1.0.0
servers:
- url: https://andes-tools-api.onrender.com
paths:
  /quotes:
    post:
      operationId: Cotizar_paquete_9624WG
      summary: Cotizar paquete
      description: 'Create an itemized quote for a package, departure date and number of travelers. Leave
        end_date out unless the traveler gave one: the package length sets it. The rate and the optional
        insurance are per person. Present only the lines, total and expiry returned here; never estimate
        prices.'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                traveler_id:
                  type: string
                  title: Traveler Id
                  description: Traveler e-mail or mobile number.
                package:
                  type: string
                  title: Package
                  description: Package id, package name or destination name.
                start_date:
                  type: string
                  title: Start Date
                  description: Departure date, YYYY-MM-DD.
                end_date:
                  type: string
                  title: End Date
                  description: 'Return date, YYYY-MM-DD. Leave it out when the traveler gave no return
                    date: the package length sets it.'
                travelers:
                  type: integer
                  title: Travelers
                  description: Number of travelers (1-20).
                include_insurance:
                  type: boolean
                  title: Include Insurance
                  description: Add travel insurance (priced per person).
                  default: false
              type: object
              required:
              - traveler_id
              - package
              - start_date
              - travelers
              title: QuoteIn
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                properties:
                  ok:
                    type: boolean
                    title: Ok
                    description: False when the request could not be fulfilled; see error.
                  error:
                    properties:
                      code:
                        type: string
                        title: Code
                        description: Stable error code, e.g. unknown_package, invalid_dates.
                      message:
                        type: string
                        title: Message
                        description: Short explanation in Spanish, safe to tell the traveler.
                    type: object
                    required:
                    - code
                    - message
                    title: ErrorInfo
                  quote_id:
                    type: string
                    title: Quote Id
                  package:
                    properties:
                      package_id:
                        type: string
                        title: Package Id
                      destination:
                        type: string
                        title: Destination
                      name:
                        type: string
                        title: Name
                      duration_days:
                        type: integer
                        title: Duration Days
                    type: object
                    required:
                    - package_id
                    - destination
                    - name
                    - duration_days
                    title: PackageInfo
                  start_date:
                    type: string
                    title: Start Date
                  end_date:
                    type: string
                    title: End Date
                  travelers:
                    type: integer
                    title: Travelers
                  lines:
                    items:
                      properties:
                        description:
                          type: string
                          title: Description
                        unit_amount:
                          type: integer
                          title: Unit Amount
                        quantity:
                          type: integer
                          title: Quantity
                        amount:
                          type: integer
                          title: Amount
                      type: object
                      required:
                      - description
                      - unit_amount
                      - quantity
                      - amount
                      title: QuoteLine
                    type: array
                    title: Lines
                  total:
                    properties:
                      amount:
                        type: integer
                        title: Amount
                        description: Integer amount in the currency's units (COP has no cents).
                      currency:
                        type: string
                        title: Currency
                    type: object
                    required:
                    - amount
                    - currency
                    title: Money
                  expires_at:
                    type: string
                    title: Expires At
                    description: ISO-8601 UTC time after which the quote is no longer valid.
                type: object
                required:
                - ok
                title: QuoteOut
      security:
      - scheme0: []
      x-ibm-orchestrate-app-id: andes_tools_api
components:
  securitySchemes:
    scheme0:
      type: apiKey
      in: header
      name: X-API-Key
