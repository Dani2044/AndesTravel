openapi: 3.0.3
info:
  title: Guardar perfil del viajero
  version: 1.0.0
servers:
- url: https://andes-tools-api.onrender.com
paths:
  /travelers/{traveler_id}/profile:
    put:
      operationId: Guardar_perfil_del_viajero_7968Lu
      summary: Guardar perfil del viajero
      description: Save the traveler's preferences and personalization summary. Only call it after the
        traveler explicitly consented to storing preferences; send consent_personalization=false when
        they decline or withdraw consent, which erases the stored profile. Attributes are merged into
        the stored ones (interests accumulate). persona_prompt replaces the stored one, so rewrite it
        with everything known; leave it out to keep the stored one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                consent_personalization:
                  type: boolean
                  title: Consent Personalization
                  description: True only if the traveler explicitly agreed that Andes Travel stores their
                    preferences to personalize future conversations. False revokes consent and erases
                    the stored profile.
                attributes:
                  properties:
                    budget_cop_per_person:
                      type: integer
                      title: Budget Cop Per Person
                      description: Budget per person in COP, if the traveler gave one.
                    travel_style:
                      type: string
                      title: Travel Style
                      description: e.g. aventura, descanso, cultural, gastronómico.
                    interests:
                      items:
                        type: string
                      type: array
                      title: Interests
                      description: e.g. playa, montaña, café.
                    group_size:
                      type: integer
                      title: Group Size
                      description: Usual number of travelers.
                    companions:
                      type: string
                      title: Companions
                      description: e.g. pareja, familia con niños, amigos, solo.
                    dates_flexibility:
                      type: string
                      title: Dates Flexibility
                      description: e.g. fechas fijas, flexible.
                    notes:
                      type: string
                      title: Notes
                      description: Other preferences. Never documents, card or health data.
                  type: object
                  title: TravelerProfileAttributes
                persona_prompt:
                  type: string
                  title: Persona Prompt
                  description: Up to 600 characters, third person, summarizing what matters to personalize
                    for this traveler (style, budget, companions, constraints, past trips). Rewrite the
                    whole summary each time; no sensitive data.
              type: object
              required:
              - consent_personalization
              title: ProfileIn
      parameters:
      - name: traveler_id
        in: path
        required: true
        schema:
          type: string
          title: Traveler Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                properties:
                  ok:
                    type: boolean
                    title: Ok
                    description: False when the request could not be fulfilled; see error.
                  error:
                    properties:
                      code:
                        type: string
                        title: Code
                        description: Stable error code, e.g. unknown_package, invalid_dates.
                      message:
                        type: string
                        title: Message
                        description: Short explanation in Spanish, safe to tell the traveler.
                    type: object
                    required:
                    - code
                    - message
                    title: ErrorInfo
                  traveler_id:
                    type: string
                    title: Traveler Id
                  stored:
                    type: boolean
                    title: Stored
                    description: True when the profile was saved.
                    default: false
                  erased:
                    type: boolean
                    title: Erased
                    description: True when consent was denied and any stored profile is gone.
                    default: false
                type: object
                required:
                - ok
                title: ProfileOut
      security:
      - scheme0: []
      x-ibm-orchestrate-app-id: andes_tools_api
components:
  securitySchemes:
    scheme0:
      type: apiKey
      in: header
      name: X-API-Key
