openapi: 3.0.3
info:
  title: Escalar a un asesor humano
  version: 1.0.0
servers:
- url: https://andes-tools-api.onrender.com
paths:
  /handoffs:
    post:
      operationId: Escalar_a_un_asesor_humano_8273cD
      summary: Escalar a un asesor humano
      description: 'Register a hand-off to a human travel advisor when the traveler asks for a person,
        is upset, or the request cannot be resolved. Include a short summary so the advisor does not have
        to ask again. traveler_id is optional: never wait for it. Tell the traveler the returned message.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: HandoffIn
              description: The html request body used to satisfy this user utterance.
              properties:
                reason:
                  type: string
                  title: Reason
                  description: Why a human is needed, e.g. asked_for_human, upset.
                summary:
                  type: string
                  title: Summary
                  description: Short summary of the conversation for the advisor.
                traveler_id:
                  type: string
                  title: Traveler Id
                  description: Traveler e-mail or mobile number, if known. Never wait for it to escalate.
              required:
              - reason
              - summary
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    title: Ok
                    description: False when the request could not be fulfilled; see error.
                  error:
                    type: object
                    title: ErrorInfo
                    properties:
                      code:
                        type: string
                        title: Code
                        description: Stable error code, e.g. unknown_package, invalid_dates.
                      message:
                        type: string
                        title: Message
                        description: Short explanation in Spanish, safe to tell the traveler.
                    required:
                    - code
                    - message
                  status:
                    type: string
                    title: Status
                  message:
                    type: string
                    title: Message
                    description: What to tell the traveler.
                  handoff_id:
                    type: string
                    title: Handoff Id
      security:
      - scheme0: []
      x-ibm-orchestrate-app-id: andes_tools_api
components:
  securitySchemes:
    scheme0:
      type: apiKey
      in: header
      name: X-API-Key
