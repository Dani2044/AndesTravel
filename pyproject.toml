[project]
name = "andes-travel"
version = "0.1.0"
description = "Omnichannel travel assistant with persistent memory, built on open-source agents (LangGraph)."
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = { text = "Apache-2.0" }
authors = [{ name = "AndesTravel contributors" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pgvector>=0.2.5",
    "langgraph>=0.2.28",
    "langchain-core>=0.3",
    "mcp>=2.0",
]

[project.optional-dependencies]
llm = ["langchain-ollama>=0.2"]
embeddings = ["numpy>=1.26"]
observability = [
    "langfuse>=2.44",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
]
voice = []  # optional voice deps omitted until cp315 wheels are available
all = ["andes-travel[llm,embeddings,observability]"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/andes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["andes"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
